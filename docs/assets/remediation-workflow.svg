<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" width="100%" height="100%">
  <defs>
    <linearGradient id="aiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#be185d" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <filter id="remedShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>

  <!-- Background -->
  <rect width="1100" height="620" fill="url(#aiBg)" />

  <!-- Grid overlay -->
  <g stroke="#334155" stroke-width="1" stroke-opacity="0.2">
    <line x1="0" y1="155" x2="1100" y2="155" />
    <line x1="0" y1="310" x2="1100" y2="310" />
    <line x1="0" y1="465" x2="1100" y2="465" />
    <line x1="275" y1="0" x2="275" y2="620" />
    <line x1="550" y1="0" x2="550" y2="620" />
    <line x1="825" y1="0" x2="825" y2="620" />
  </g>

  <!-- Title & Header -->
  <text x="50" y="50" fill="#f8fafc" class="sans" font-size="24" font-weight="800">AI Remediation &amp; Fallback Decision Engine</text>
  <text x="50" y="75" fill="#94a3b8" class="sans" font-size="13">Dual-Path Architecture: Local Ollama LLM + Deterministic Expert Rule Engine</text>

  <!-- 1. Input Node -->
  <g transform="translate(50, 120)" filter="url(#remedShadow)">
    <rect width="210" height="420" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1" />
    <rect width="210" height="38" rx="12" fill="#38bdf8" opacity="0.15" />
    <text x="16" y="25" fill="#38bdf8" class="sans" font-size="13" font-weight="700">1. Violation Input</text>
    
    <g transform="translate(14, 55)">
      <text x="0" y="16" fill="#f8fafc" class="sans" font-size="12" font-weight="600">Context Extraction</text>
      <text x="0" y="36" fill="#94a3b8" class="sans" font-size="11">• Rule ID (e.g. image-alt)</text>
      <text x="0" y="54" fill="#94a3b8" class="sans" font-size="11">• Selector Path (#hero-img)</text>
      <text x="0" y="72" fill="#94a3b8" class="sans" font-size="11">• Raw Outer HTML</text>
      <text x="0" y="90" fill="#94a3b8" class="sans" font-size="11">• WCAG Criteria Tag</text>
    </g>

    <g transform="translate(14, 175)">
      <rect width="182" height="110" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="10" y="20" fill="#38bdf8" class="mono" font-size="10">Raw Node Snippet:</text>
      <text x="10" y="42" fill="#ef4444" class="mono" font-size="9">&lt;img src="logo.png"&gt;</text>
      <text x="10" y="66" fill="#94a3b8" class="mono" font-size="9">Violation: image-alt</text>
      <text x="10" y="86" fill="#fbbf24" class="mono" font-size="9">Impact: critical</text>
    </g>

    <g transform="translate(14, 305)">
      <text x="0" y="16" fill="#f8fafc" class="sans" font-size="12" font-weight="600">Prompt Sanitization</text>
      <text x="0" y="36" fill="#94a3b8" class="sans" font-size="11">• Escape control chars</text>
      <text x="0" y="54" fill="#94a3b8" class="sans" font-size="11">• Enforce system prompt</text>
      <text x="0" y="72" fill="#94a3b8" class="sans" font-size="11">• Invariant JSON spec</text>
    </g>
  </g>

  <!-- 2. Decision Fork & Primary AI Engine -->
  <g transform="translate(310, 120)" filter="url(#remedShadow)">
    <rect width="250" height="200" rx="12" fill="url(#cardGrad)" stroke="#ec4899" stroke-width="1.5" />
    <rect width="250" height="38" rx="12" fill="url(#pinkGrad)" opacity="0.2" />
    <text x="16" y="25" fill="#f472b6" class="sans" font-size="13" font-weight="700">2A. Primary: Ollama Local LLM</text>

    <g transform="translate(16, 50)">
      <text x="0" y="16" fill="#f8fafc" class="sans" font-size="12" font-weight="600">Inference Gateway</text>
      <text x="0" y="34" fill="#94a3b8" class="sans" font-size="11">• Model: llama3:8b (or configured)</text>
      <text x="0" y="52" fill="#94a3b8" class="sans" font-size="11">• Endpoint: http://localhost:11434</text>
      <text x="0" y="70" fill="#94a3b8" class="sans" font-size="11">• Format: Strict JSON mode</text>
      <text x="0" y="88" fill="#94a3b8" class="sans" font-size="11">• Timeout: 30s abort controller</text>
    </g>

    <rect x="16" y="150" width="218" height="32" rx="6" fill="#0f172a" />
    <text x="24" y="171" fill="#f472b6" class="mono" font-size="10">Source: "ollama" | High Accuracy</text>
  </g>

  <!-- 3. Deterministic Fallback Engine (Bottom Branch) -->
  <g transform="translate(310, 350)" filter="url(#remedShadow)">
    <rect width="250" height="190" rx="12" fill="url(#cardGrad)" stroke="#f59e0b" stroke-width="1.5" />
    <rect width="250" height="38" rx="12" fill="url(#amberGrad)" opacity="0.2" />
    <text x="16" y="25" fill="#fbbf24" class="sans" font-size="13" font-weight="700">2B. Fallback: Rule Engine</text>

    <g transform="translate(16, 50)">
      <text x="0" y="16" fill="#f8fafc" class="sans" font-size="12" font-weight="600">Zero-Dependency Heuristics</text>
      <text x="0" y="34" fill="#94a3b8" class="sans" font-size="11">• Triggers on: Offline, timeout, error</text>
      <text x="0" y="52" fill="#94a3b8" class="sans" font-size="11">• 50+ WCAG expert rule templates</text>
      <text x="0" y="70" fill="#94a3b8" class="sans" font-size="11">• 100% deterministic code fix</text>
    </g>

    <rect x="16" y="142" width="218" height="32" rx="6" fill="#0f172a" />
    <text x="24" y="163" fill="#fbbf24" class="mono" font-size="10">Source: "fallback" | 100% Uptime</text>
  </g>

  <!-- 4. Zod Validation & Parsing Gateway -->
  <g transform="translate(610, 200)" filter="url(#remedShadow)">
    <rect width="210" height="260" rx="12" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1" />
    <rect width="210" height="38" rx="12" fill="url(#greenGrad)" opacity="0.15" />
    <text x="16" y="25" fill="#34d399" class="sans" font-size="13" font-weight="700">3. Zod Guardrail</text>

    <g transform="translate(14, 52)">
      <text x="0" y="16" fill="#f8fafc" class="sans" font-size="12" font-weight="600">Schema Enforcement</text>
      <text x="0" y="36" fill="#94a3b8" class="mono" font-size="10">✓ explanation: string</text>
      <text x="0" y="54" fill="#94a3b8" class="mono" font-size="10">✓ originalSnippet: string</text>
      <text x="0" y="72" fill="#94a3b8" class="mono" font-size="10">✓ fixedSnippet: string</text>
      <text x="0" y="90" fill="#94a3b8" class="mono" font-size="10">✓ confidence: number</text>
      <text x="0" y="108" fill="#94a3b8" class="mono" font-size="10">✓ rationale: string</text>
    </g>

    <g transform="translate(14, 185)">
      <rect width="182" height="55" rx="6" fill="#0f172a" />
      <text x="10" y="20" fill="#34d399" class="sans" font-size="10" font-weight="600">Validation Safety:</text>
      <text x="10" y="38" fill="#94a3b8" class="sans" font-size="9">If Ollama fails Zod, auto-diverts to deterministic fallback.</text>
    </g>
  </g>

  <!-- 5. Output / Dashboard Presentation -->
  <g transform="translate(865, 120)" filter="url(#remedShadow)">
    <rect width="190" height="420" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1" />
    <rect width="190" height="38" rx="12" fill="#38bdf8" opacity="0.15" />
    <text x="16" y="25" fill="#38bdf8" class="sans" font-size="13" font-weight="700">4. Remediation Output</text>

    <g transform="translate(14, 55)">
      <text x="0" y="16" fill="#f8fafc" class="sans" font-size="12" font-weight="600">Verified Solution</text>
      <text x="0" y="36" fill="#94a3b8" class="sans" font-size="11">• Side-by-side Diff</text>
      <text x="0" y="54" fill="#94a3b8" class="sans" font-size="11">• 1-Click Copy Code</text>
      <text x="0" y="72" fill="#94a3b8" class="sans" font-size="11">• Confidence Badge</text>
      <text x="0" y="90" fill="#94a3b8" class="sans" font-size="11">• Source Indicator</text>
    </g>

    <g transform="translate(14, 175)">
      <rect width="162" height="110" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1" />
      <text x="10" y="20" fill="#34d399" class="mono" font-size="10">Remediated Snippet:</text>
      <text x="10" y="44" fill="#34d399" class="mono" font-size="9">&lt;img src="logo.png"</text>
      <text x="10" y="60" fill="#34d399" class="mono" font-size="9">     alt="Company logo"&gt;</text>
      <text x="10" y="86" fill="#38bdf8" class="mono" font-size="9">Score Impact: +4 pts</text>
    </g>

    <g transform="translate(14, 310)">
      <rect width="162" height="90" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="10" y="20" fill="#f8fafc" class="sans" font-size="11" font-weight="600">Persisted in DB</text>
      <text x="10" y="38" fill="#94a3b8" class="sans" font-size="10">• Cached per-violation</text>
      <text x="10" y="54" fill="#94a3b8" class="sans" font-size="10">• Exported to PDF report</text>
      <text x="10" y="70" fill="#94a3b8" class="sans" font-size="10">• Zero repeat inference</text>
    </g>
  </g>

  <!-- Connectors -->
  <g stroke="#38bdf8" stroke-width="2" fill="none">
    <!-- Input to 2A and 2B -->
    <path d="M 260 220 L 310 220" />
    <path d="M 260 220 L 285 220 L 285 440 L 310 440" />
    <!-- 2A to Zod -->
    <path d="M 560 220 L 610 280" />
    <!-- 2B to Zod -->
    <path d="M 560 440 L 610 370" />
    <!-- Zod to Output -->
    <path d="M 820 330 L 865 330" />
  </g>
</svg>
