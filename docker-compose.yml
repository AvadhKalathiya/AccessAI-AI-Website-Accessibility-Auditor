services:
  accessai:
    build:
      context: .
      dockerfile: Dockerfile
    image: accessai:latest
    container_name: accessai-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=file:/app/data/accessai.db
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=llama3.2
      - OLLAMA_TIMEOUT_MS=25000
      - MAX_CONCURRENT_SCANS=2
      - SCAN_TIMEOUT_MS=25000
    # Enable container to reach local Ollama on host machine
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - accessai-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/api/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  accessai-data:
    name: accessai-data
